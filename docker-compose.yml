services:
  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    ports:
      - "8069:8069"
      - "8072:8072"
    volumes:
      - ./community:/odoo
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./config/certs:/etc/odoo/certs
      - ./addons:/mnt/extra-addons
      - ./logs:/var/log/odoo
      - ./entrypoint.sh:/entrypoint.sh
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - DB=odoo
      - PYTHONIOENCODING=utf-8
      - INIT_MODULES=base,web
    entrypoint: ["/entrypoint.sh"]
    restart: always

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=odoo
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    ports:
      - "5432:5432"
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: always

volumes:
  odoo-web-data:
    name: odoo-18-docker_odoo-web-data
  odoo-db-data:
    name: odoo-18-docker_odoo-db-data
